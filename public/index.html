<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Username Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000; /* black background */
    }

    .form-container {
      background: #111;
      padding: 80px 50px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 320px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
    }

    .form-container h2 {
      margin: 0;
      color: #ffd700; /* yellow */
      text-align: center;
      letter-spacing: 1px;
    }

    input {
      padding: 14px;
      border-radius: 10px;
      border: 2px solid #ffd700;
      background: #000;
      color: #ffd700;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #c9b400;
    }

    input:focus {
      box-shadow: 0 0 10px #ffd700;
    }

    button {
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #ffd700;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      background: #000000;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>

  <form class="form-container" method="post" action="/login">
    <h2>Welcome</h2>
    <input 
      type="text" 
      name="username" 
      id="username"
      placeholder="Enter your username"
      required
    />
    <button type="submit">Continue</button>
  </form>

</body>
</html>
